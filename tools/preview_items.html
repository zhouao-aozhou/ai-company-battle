<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { background:#0f1524; color:#dfe9ff; font-family:"Microsoft YaHei",sans-serif; padding:26px 34px; }
.rp-sec { font-size:13px; font-weight:700; color:#9fc2ff; letter-spacing:2px; margin-bottom:12px; }
.icard {
  display:flex; align-items:center; gap:13px; padding:13px 16px; margin-bottom:9px;
  border-radius:12px; background:rgba(30,44,72,.66); border:1px solid rgba(90,120,170,.28);
}
.ic-icon { font-size:24px; width:32px; text-align:center; flex:none; }
.ic-main { flex:1; min-width:0; }
.ic-name { font-size:13.5px; font-weight:700; }
.ic-name .day { font-size:10px; font-weight:400; color:#7f93b8; margin-left:6px; }
.ic-desc { font-size:11.5px; color:#93a9c8; margin-top:3px; }
.ic-price {
  flex:none; font-size:12.5px; font-weight:700; color:#ffc861;
  padding:5px 12px; border-radius:8px; background:rgba(255,200,97,.12);
  border:1px solid rgba(255,200,97,.3);
}
</style></head><body>
  <div class="rp-sec">增益道具 · 共 8 种</div>
    <div class="icard">
      <div class="ic-icon">🍰</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#ffb3c7">下午茶 <span class="day">第 9 天</span></div>
        <div class="ic-desc">全体主管心情 +10</div>
      </div>
      <div class="ic-price">¥1600</div>
    </div>
    <div class="icard">
      <div class="ic-icon">💊</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#7de38f">体能补给 <span class="day">第 9 天</span></div>
        <div class="ic-desc">全体组员体力 +22</div>
      </div>
      <div class="ic-price">¥1400</div>
    </div>
    <div class="icard">
      <div class="ic-icon">🚀</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#ff9bd0">订单加速器 <span class="day">第 12 天</span></div>
        <div class="ic-desc">在手订单进度全部 +15%</div>
      </div>
      <div class="ic-price">¥3200</div>
    </div>
    <div class="icard">
      <div class="ic-icon">⚡</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#7de3ff">算力包 <span class="day">第 15 天</span></div>
        <div class="ic-desc">立即 +30 算力，可囤着大批出动员工时用</div>
      </div>
      <div class="ic-price">¥2500</div>
    </div>
    <div class="icard">
      <div class="ic-icon">🛡️</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#8fe3ff">逾期免罚券 <span class="day">第 18 天</span></div>
        <div class="ic-desc">下一次订单逾期不扣钱（自动消耗）</div>
      </div>
      <div class="ic-price">¥2200</div>
    </div>
    <div class="icard">
      <div class="ic-icon">📨</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#ffc861">客户介绍信 <span class="day">第 22 天</span></div>
        <div class="ic-desc">立刻来一张新订单</div>
      </div>
      <div class="ic-price">¥3800</div>
    </div>
    <div class="icard">
      <div class="ic-icon">📢</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#ffc861">动员令 <span class="day">第 30 天</span></div>
        <div class="ic-desc">今日免费算力额度 +8，当天可以放开派人</div>
      </div>
      <div class="ic-price">¥4500</div>
    </div>
    <div class="icard">
      <div class="ic-icon">🔋</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#8fe3ff">算力上限扩容 <span class="day">第 50 天</span></div>
        <div class="ic-desc">算力上限永久 +50，能存住更多算力</div>
      </div>
      <div class="ic-price">¥9000</div>
    </div>
</body></html>
