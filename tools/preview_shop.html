<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { background:#0f1524; color:#dfe9ff; font-family:"Microsoft YaHei",sans-serif; padding:34px 40px; }
.icard {



    display: flex; align-items: center; gap: 11px;



    background: #18213a; border: 1px solid #2c3b5c; border-radius: 10px;



    padding: 10px 13px; cursor: pointer; transition: .12s;



  }
.ic-icon { font-size: 22px; flex: none; width: 30px; text-align: center; }
.ic-main { flex: 1; min-width: 0; }
.ic-name { font-size: 12.5px; font-weight: 600; }
.ic-desc { font-size: 10.5px; color: #8ea3c9; margin-top: 2px; line-height: 1.5; }
.ic-price {



    flex: none; font-size: 12.5px; font-weight: 600; color: #ffc861;



    background: #2e2410; border: 1px solid #6b5320; border-radius: 7px; padding: 5px 10px;



  }
.rp-sec { font-size: 12px; color: #7f93b8; margin: 14px 0 9px; letter-spacing: .5px; }
.shop-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.hr-pane { max-width: 640px; }
</style></head><body>
<div class="hr-pane">
  <div class="rp-sec">算力道具</div>
  <div class="shop-grid">
    <div class="icard">
      <div class="ic-icon">⚡</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#7de3ff">算力包</div>
        <div class="ic-desc">立即 +30 算力，可囤着大批出动员工时用</div>
      </div>
      <div class="ic-price">¥2500</div>
    </div>
    <div class="icard">
      <div class="ic-icon">📢</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#ffc861">动员令</div>
        <div class="ic-desc">今日免费算力额度 +8，当天可以放开派人</div>
      </div>
      <div class="ic-price">¥4500</div>
    </div>
    <div class="icard">
      <div class="ic-icon">🔋</div>
      <div class="ic-main">
        <div class="ic-name" style="color:#8fe3ff">算力上限扩容</div>
        <div class="ic-desc">算力上限永久 +50，能存住更多算力</div>
      </div>
      <div class="ic-price">¥9000</div>
    </div>
  </div>
</div>
</body></html>
